<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUDMA Health Center</title>
<style>
:root{--ink:#16302b;--bg:#f3f6f4;--card:#fff;--line:#d5e0db;--main:#0f5c4d;--accent:#c8553d}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Georgia,'Times New Roman',serif;color:var(--ink);background:var(--bg)}
h1,h3,button,input,select,th,header{font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--main);color:#fff;padding:12px 20px}
main,#auth{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;overflow-x:auto}
h3{margin:0 0 10px}input,select{padding:8px;border:1px solid var(--line);border-radius:4px;margin:3px 4px 3px 0;font-size:15px;max-width:100%}
button{background:var(--main);color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer;font-size:14px}
button.alt{background:#fff;color:var(--main);border:1px solid var(--main)}button.slot{margin:3px;padding:6px 10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.id{font:700 22px system-ui;color:var(--accent);letter-spacing:1px}.err{color:#a3261a;font-family:system-ui}.ok{color:#146c43;font-family:system-ui}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{flex:1;min-width:120px;border:1px solid var(--line);border-radius:6px;padding:10px}.stats b{font:700 26px system-ui;display:block}
</style></head><body><div id="app"></div><script src="app.js"></script></body></html>
